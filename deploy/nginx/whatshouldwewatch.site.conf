# nginx site for whatshouldwewatch.site
# Installed on the server at /etc/nginx/sites-available/whatshouldwewatch.site
# Certificates are issued by Let's Encrypt via certbot.

# HTTP: redirect everything to the canonical HTTPS address.
server {
    listen 80;
    listen [::]:80;
    server_name whatshouldwewatch.site www.whatshouldwewatch.site;
    server_tokens off;

    return 301 https://whatshouldwewatch.site$request_uri;
}

# HTTPS on www: redirect to the address without www.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.whatshouldwewatch.site;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/whatshouldwewatch.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatshouldwewatch.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://whatshouldwewatch.site$request_uri;
}

# HTTPS: the app.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name whatshouldwewatch.site;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/whatshouldwewatch.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatshouldwewatch.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/whatshouldwewatch/client/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Security headers. Locations below must not use add_header, or these are
    # dropped there: nginx only inherits add_header from the level above when a
    # block defines none of its own.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://image.tmdb.org; connect-src 'self' wss://whatshouldwewatch.site; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed file names change whenever their content does, so they can be
    # cached for a long time.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # index.html names the current assets, so browsers must always revalidate it.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}